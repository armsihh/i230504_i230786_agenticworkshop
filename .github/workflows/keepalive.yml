# Render's free tier sleeps after 15 minutes without inbound traffic and takes ~1 minute to wake.
# Pinging /health every 10 minutes keeps the agent awake for the grader and visitors.
# Set the repository variable API_URL (Settings -> Secrets and variables -> Actions -> Variables).
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_URL }}/health"
